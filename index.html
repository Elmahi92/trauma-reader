<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f2eb">
  <title>عُذِّب في طفولته | مكتبة القراءة</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f2eb;
      --surface: #fffefa;
      --ink: #202a28;
      --muted: #66716c;
      --line: #d9ddd5;
      --green: #1c6659;
      --green-deep: #164a42;
      --green-pale: #e7f0eb;
      --coral: #b6533d;
      --sand: #e9dfcb;
      --shadow: 0 18px 48px rgba(35, 48, 42, .08);
      --reader-size: 19px;
      --reader-leading: 2.05;
      --font: "Noto IKEA Arabic", Tahoma, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font);
      font-size: 19px;
      line-height: 1.9;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    a { color: inherit; }
    :focus-visible { outline: 3px solid #b6533d; outline-offset: 3px; }
    .skip-link { position: fixed; top: 8px; inset-inline-start: 8px; z-index: 50; padding: 7px 12px; transform: translateY(-150%); color: #fff; background: var(--green-deep); border-radius: 6px; }
    .skip-link:focus { transform: translateY(0); }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      min-height: 76px;
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 12px clamp(16px, 4vw, 56px);
      background: rgba(255, 254, 250, .96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 220px;
      text-decoration: none;
    }
    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--green);
      border-radius: 13px 13px 4px 13px;
      font-size: 23px;
      line-height: 1;
    }
    .brand-title { display: block; font-size: 19px; font-weight: 700; line-height: 1.25; }
    .brand-subtitle { display: block; color: var(--muted); font-size: 14px; line-height: 1.2; }
    .search-wrap { position: relative; flex: 1; max-width: 620px; margin-inline-start: auto; }
    .search-box {
      width: 100%;
      height: 46px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 15px;
      background: #f7f7f2;
      border: 1px solid var(--line);
      border-radius: 9px;
    }
    .search-box:focus-within { border-color: var(--green); box-shadow: 0 0 0 3px rgba(28, 102, 89, .1); }
    .search-symbol { color: var(--green); font-size: 22px; line-height: 1; }
    .search-box input { width: 100%; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 17px; }
    .search-box input::placeholder { color: #7b8580; }
    .search-hint { color: var(--muted); font-family: Arial, sans-serif; font-size: 11px; direction: ltr; }
    .search-results {
      position: absolute;
      inset: 54px 0 auto 0;
      display: none;
      max-height: min(70vh, 620px);
      overflow: auto;
      padding: 8px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: var(--shadow);
    }
    .search-results.open { display: block; }
    .result-count { padding: 7px 10px; color: var(--muted); font-size: 15px; }
    .result-item {
      width: 100%;
      display: block;
      padding: 10px 12px;
      text-align: right;
      background: transparent;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
    }
    .result-item:hover, .result-item:focus-visible { background: var(--green-pale); outline: 0; }
    .result-title { display: flex; justify-content: space-between; gap: 12px; font-weight: 700; color: var(--green-deep); }
    .result-page { color: var(--coral); font-size: 14px; white-space: nowrap; }
    .result-snippet { display: block; margin-top: 3px; color: var(--muted); font-size: 15px; line-height: 1.65; }
    .top-current { color: var(--muted); font-size: 15px; white-space: nowrap; }

    .layout { width: min(1500px, 100%); margin: 0 auto; display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 34px; padding: 30px clamp(16px, 4vw, 56px) 70px; }
    .sidebar { grid-column: 1; grid-row: 1; align-self: start; position: sticky; top: 98px; max-height: calc(100vh - 120px); overflow: auto; padding: 17px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
    .side-kicker { margin: 2px 9px 10px; color: var(--muted); font-size: 14px; font-weight: 700; }
    .chapter-nav { display: grid; gap: 4px; }
    .chapter-link {
      width: 100%; display: flex; align-items: flex-start; gap: 11px; padding: 10px 9px;
      text-align: right; background: transparent; border: 0; border-radius: 8px; cursor: pointer;
    }
    .chapter-link:hover { background: #f2f4ef; }
    .chapter-link.active { color: var(--green-deep); background: var(--green-pale); }
    .chapter-num { flex: 0 0 28px; height: 28px; display: grid; place-items: center; border: 1px solid #b5c9be; border-radius: 8px; font-family: Arial, sans-serif; font-size: 13px; line-height: 1; }
    .chapter-link.active .chapter-num { color: #fff; background: var(--green); border-color: var(--green); }
    .chapter-name { font-size: 16px; line-height: 1.45; }
    .side-sections { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 14px; }
    .side-sections summary { padding: 0 8px 8px; color: var(--muted); cursor: pointer; font-size: 15px; font-weight: 700; }
    .section-nav { display: grid; gap: 2px; }
    .section-link { padding: 5px 9px; color: var(--muted); text-align: right; font-size: 14px; line-height: 1.5; background: transparent; border: 0; border-inline-start: 2px solid transparent; cursor: pointer; }
    .section-link:hover, .section-link.active { color: var(--green-deep); border-inline-start-color: var(--green); background: #f4f6f2; }
    .side-bookmarks { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
    .side-bookmarks summary { padding: 0 8px 8px; color: var(--muted); cursor: pointer; font-size: 15px; font-weight: 700; }
    .bookmark-list { display: grid; gap: 4px; }
    .bookmark-entry { display: flex; align-items: center; gap: 5px; }
    .bookmark-jump { min-width: 0; flex: 1; padding: 6px 8px; overflow: hidden; color: var(--green-deep); text-align: right; text-overflow: ellipsis; white-space: nowrap; background: transparent; border: 0; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .bookmark-jump:hover { background: var(--green-pale); }
    .bookmark-remove { width: 30px; height: 30px; color: var(--muted); background: transparent; border: 0; border-radius: 6px; cursor: pointer; }
    .bookmark-remove:hover { color: var(--coral); background: #f7e9e3; }
    .bookmark-empty { margin: 0; padding: 2px 8px 8px; color: var(--muted); font-size: 14px; }
    .sidebar-note { margin: 17px 8px 2px; padding-top: 12px; color: var(--muted); border-top: 1px solid var(--line); font-size: 13px; line-height: 1.65; }

    main { grid-column: 2; grid-row: 1; min-width: 0; }
    .welcome { min-height: 210px; display: flex; flex-direction: column; justify-content: center; padding: 25px clamp(10px, 4vw, 48px) 34px; background: radial-gradient(ellipse at 8% 20%, rgba(182, 83, 61, .1), transparent 32%), linear-gradient(105deg, rgba(28, 102, 89, .07), rgba(28, 102, 89, 0) 58%); border-bottom: 1px solid var(--line); }
    .eyebrow { display: inline-flex; align-items: center; gap: 9px; color: var(--coral); font-size: 15px; font-weight: 700; }
    .eyebrow::before { width: 22px; height: 2px; content: ""; background: var(--coral); }
    h1 { margin: 8px 0 2px; font-size: clamp(30px, 4vw, 46px); font-weight: 700; line-height: 1.35; }
    .chapter-deck { max-width: 760px; margin: 4px 0 0; color: var(--muted); font-size: 18px; line-height: 1.7; }
    .read-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 9px 18px; margin: 10px 0 20px; color: var(--muted); font-size: 14px; }
    .meta-pill { display: inline-flex; align-items: center; gap: 7px; }
    .progress-track { width: min(200px, 40vw); height: 5px; overflow: hidden; background: #dfe4de; border-radius: 10px; }
    .progress-fill { width: 0; height: 100%; background: var(--coral); transition: width .15s linear; }
    .reader-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
    .tool-group { display: inline-flex; direction: ltr; align-items: center; overflow: hidden; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); }
    .tool-button, .tool-link { min-height: 37px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 5px 10px; color: var(--green-deep); text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; cursor: pointer; font-size: 15px; line-height: 1.3; }
    .tool-group .tool-button { width: 38px; padding: 4px; border: 0; border-radius: 0; font-family: Arial, sans-serif; font-size: 18px; }
    .tool-group .tool-button + .tool-button { border-inline-start: 1px solid var(--line); }
    .tool-button:hover, .tool-link:hover { background: var(--green-pale); border-color: #a9c4b8; }
    .tool-button[aria-pressed="true"] { color: #fff; background: var(--green); border-color: var(--green); }
    .tool-button[aria-pressed="true"]:hover { background: var(--green-deep); }
    .summary-block { margin: 0 clamp(10px, 4vw, 48px) 30px; padding: 16px 20px 17px; background: var(--green-pale); border-inline-start: 4px solid var(--green); border-radius: 0 8px 8px 0; }
    .summary-label { margin: 0 0 5px; color: var(--green-deep); font-size: 14px; font-weight: 700; }
    .summary-block p { margin: 0; font-size: 17px; line-height: 1.8; }
    .takeaways { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 11px; }
    .takeaway { padding: 3px 10px; color: #28584d; background: rgba(255,255,255,.65); border: 1px solid rgba(28,102,89,.16); border-radius: 999px; font-size: 14px; }
    .original-heading { display: flex; align-items: center; gap: 14px; margin: 0 clamp(10px, 4vw, 48px) 12px; font-size: 18px; font-weight: 700; }
    .original-heading::after { height: 1px; flex: 1; content: ""; background: var(--line); }
    .reading-area { margin: 0 clamp(10px, 4vw, 48px); }
    .content-block { scroll-margin-top: 105px; }
    .content-block.search-hit { animation: searchFocus 1.8s ease-out; }
    @keyframes searchFocus { 0%, 45% { background: #f7df99; box-shadow: 0 0 0 6px #f7df99; } 100% { background: transparent; box-shadow: 0 0 0 0 transparent; } }
    .content-block p, p.content-block { margin: 0 0 1.05em; font-size: var(--reader-size); line-height: var(--reader-leading); white-space: pre-wrap; overflow-wrap: anywhere; }
    .content-block h2 { margin: 1.65em 0 .6em; color: var(--green-deep); font-size: 25px; line-height: 1.5; }
    .content-block h3 { margin: 1.3em 0 .45em; color: #35564e; font-size: 21px; line-height: 1.5; }
    .source-page { display: flex; align-items: center; gap: 12px; margin: 30px 0 19px; color: var(--coral); font-family: Arial, sans-serif; font-size: 12px; font-weight: 700; scroll-margin-top: 105px; }
    .source-page::before, .source-page::after { height: 1px; flex: 1; content: ""; background: #e5c8be; }
    .book-list { margin: 0 0 1.2em; padding: 0 1.6em 0 0; }
    .book-list li { padding-inline-start: 5px; margin: 4px 0; font-size: 18px; line-height: 1.8; overflow-wrap: anywhere; }
    .book-quote { margin: 1em 0 1.25em; padding: 12px 20px 12px 14px; color: #384540; background: #f3f2ec; border-inline-start: 3px solid #c5ab7d; border-radius: 0 7px 7px 0; }
    .book-quote p { margin: 0 0 .7em; font-size: var(--reader-size); line-height: var(--reader-leading); overflow-wrap: anywhere; }
    .book-quote p:last-child { margin-bottom: 0; }
    .reader-bottom { display: flex; justify-content: space-between; gap: 12px; margin: 46px 0 20px; padding-top: 20px; border-top: 1px solid var(--line); }
    .nav-button { min-width: 140px; padding: 10px 15px; color: var(--green-deep); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; text-align: center; }
    .nav-button:hover:not(:disabled) { border-color: var(--green); background: var(--green-pale); }
    .nav-button:disabled { color: #a0a8a2; cursor: not-allowed; }
    .nav-button small { display: block; color: var(--muted); font-size: 13px; }
    .empty-state { padding: 60px 25px; color: var(--muted); text-align: center; }
    .loading { min-height: 50vh; display: grid; place-items: center; color: var(--muted); }
    mark { padding: 0 .12em; background: #f7df99; border-radius: 3px; }
    .toast { position: fixed; inset: auto 50% 20px auto; transform: translateX(50%); z-index: 30; padding: 8px 14px; color: #fff; background: var(--green-deep); border-radius: 7px; box-shadow: var(--shadow); font-size: 15px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    @media (max-width: 950px) {
      .layout { grid-template-columns: 1fr; gap: 16px; padding-top: 15px; }
      .sidebar { position: static; grid-column: 1; grid-row: 1; max-height: none; padding: 12px; }
      .sidebar .side-kicker, .sidebar-note { display: none; }
      .side-sections, .side-bookmarks { margin: 8px 2px 0; padding: 8px 2px 0; }
      .section-nav, .bookmark-list { max-height: 150px; overflow: auto; }
      .chapter-nav { display: flex; overflow-x: auto; gap: 5px; padding-bottom: 2px; scrollbar-width: thin; }
      .chapter-link { width: max-content; min-width: 145px; align-items: center; padding: 7px; }
      .chapter-name { max-width: 120px; font-size: 14px; }
      main { grid-column: 1; grid-row: 2; }
      .top-current { display: none; }
      .brand { min-width: 42px; }
      .brand-copy { display: none; }
    }
    @media (max-width: 600px) {
      body { font-size: 17px; }
      .topbar { min-height: 64px; gap: 11px; padding: 9px 12px; }
      .brand-mark { width: 38px; height: 38px; }
      .search-box { height: 42px; padding: 0 10px; }
      .search-hint { display: none; }
      .layout { padding-inline: 12px; }
      .welcome { min-height: 175px; padding: 20px 6px 24px; }
      h1 { font-size: 30px; }
      .chapter-deck { font-size: 16px; }
      .summary-block, .original-heading, .reading-area { margin-inline: 5px; }
      .summary-block { padding: 13px 15px; }
      .content-block p, p.content-block { font-size: var(--reader-size); line-height: var(--reader-leading); }
      .content-block h2 { font-size: 22px; }
      .content-block h3 { font-size: 19px; }
      .book-list li, .book-quote p { font-size: 17px; }
      .reader-bottom { gap: 8px; }
      .nav-button { min-width: 0; flex: 1; padding: 8px 9px; font-size: 16px; }
      .reader-tools { gap: 6px; }
      .tool-button, .tool-link { min-height: 35px; padding: 5px 8px; font-size: 14px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
    @media print {
      @page { size: A5; margin: 15mm; }
      body { background: #fff; color: #000; font-size: 12pt; }
      .topbar, .sidebar, .summary-block, .reader-tools, .reader-bottom, .original-heading { display: none !important; }
      .layout { display: block; width: 100%; margin: 0; padding: 0; }
      main { width: 100%; }
      .welcome { min-height: 0; padding: 0 0 10mm; background: none; border-bottom: 1px solid #888; }
      .content-block p { font-size: 12pt !important; line-height: 1.7 !important; }
      .content-block h2, .content-block h3 { color: #000; }
      .source-page { break-before: page; color: #444; }
      .content-block { break-inside: avoid; }
      .chapter-deck { color: #222; }
      a { text-decoration: none; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#mainContent">انتقل إلى النص</a>
  <header class="topbar">
    <a class="brand" href="#top" aria-label="العودة إلى بداية الكتاب">
      <span class="brand-mark" aria-hidden="true">ك</span>
      <span class="brand-copy"><span class="brand-title">عُذِّب في طفولته</span><span class="brand-subtitle">مكتبة القراءة والتعلّم</span></span>
    </a>
    <div class="search-wrap">
      <label class="search-box" for="searchInput">
        <span class="search-symbol" aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="ابحث في الفصول العربية" autocomplete="off" aria-label="ابحث في محتوى الكتاب" aria-controls="searchResults" aria-expanded="false" aria-autocomplete="list">
        <span class="search-hint">بحث</span>
      </label>
      <div class="search-results" id="searchResults" role="listbox" aria-label="نتائج البحث" aria-live="polite"></div>
    </div>
    <div class="top-current" id="topCurrent">الفصل الأول</div>
  </header>

  <div class="layout" id="top">
    <aside class="sidebar" aria-label="التنقل في الكتاب">
      <div class="side-kicker">محتويات الكتاب</div>
      <nav class="chapter-nav" id="chapterNav"></nav>
      <details class="side-sections" id="sectionsDetails" open>
        <summary>داخل الفصل</summary>
        <nav class="section-nav" id="sectionNav"></nav>
      </details>
      <details class="side-bookmarks" id="bookmarksDetails">
        <summary>علاماتي المحفوظة</summary>
        <nav class="bookmark-list" id="bookmarkList" aria-label="المواضع المحفوظة"></nav>
      </details>
      <div class="sidebar-note">النصوص المعروضة هي الترجمات العربية للفصول. الملخص ونقاط التعلّم إضافات منفصلة عن النص الأصلي.</div>
    </aside>

    <main id="mainContent" tabindex="-1">
      <div class="loading" id="loadingState">جارٍ تحميل الكتاب…</div>
    </main>
  </div>

  <script>
    const chapters = [
      { id: '01', file: 'chapter_texts/01_kapitel_1_introduktion_ar.txt', title: 'مقدمة', subtitle: 'التعذيب: المفهوم والتاريخ والوعي بالعنف ضد الأطفال', range: '15–34', summary: 'يعرض الفصل نشأة مفهوم التعذيب قانونيًا ونفسيًا، ويشرح أثر فقدان السيطرة والصدمة، ثم يربط ذلك بتاريخ الوعي الطبي بالعنف ضد الأطفال ومشروع البحث عن الأطفال الناجين من التعذيب.', points: ['التعذيب يتجاوز الألم الجسدي', 'السيطرة والسياق يؤثران في الصدمة', 'العنف في الطفولة يخلّف آثارًا صحية طويلة الأمد'] },
      { id: '02', file: 'chapter_texts/02_kapitel_2_vad_utgor_tortyr_mot_barn_ar.txt', title: 'ما الذي يشكل تعذيبًا للأطفال؟', subtitle: 'الإطار القانوني، حظر التعذيب، ومسؤولية حماية الأطفال', range: '35–84', summary: 'يشرح الفصل تعريف التعذيب وإساءة المعاملة في القانون الدولي، ومبدأ عدم الإعادة القسرية، وواجبات الدولة تجاه الأطفال، مع أمثلة من اللجوء والاحتجاز والحرب.', points: ['حظر التعذيب مطلق', 'تُراعى هشاشة الطفل وعمره في التقييم', 'التوثيق والتحقيق وجبر الضرر التزامات أساسية'] },
      { id: '03', file: 'chapter_texts/03_kapitel_3_att_fraga_barn_om_tortyr_ar.txt', title: 'سؤال الأطفال عن التعذيب', subtitle: 'الاكتشاف المبكر، الصمت، وأداة خريطة التعرض للأذى', range: '85–128', summary: 'يناقش الفصل أسباب عدم اكتشاف الأطفال الناجين من التعذيب، وأثر الصمت والإجراءات الجامدة، ويعرض أداة حوارية تراعي العلاقة والسياق وتجارب الطفل.', points: ['الثقة والأمان يسبقان الإفصاح', 'الفحص الروتيني وحده قد يفوّت تجارب مهمة', 'الاستماع للعلاقة والسياق يدعم الاكتشاف'] },
      { id: '04', file: 'chapter_texts/04_kapitel_4_barnanpassad_tortyrskadedokumentation_ar.txt', title: 'توثيق إصابات التعذيب الملائم للأطفال', subtitle: 'بروتوكول إسطنبول، الفحص الطبي والنفسي، ومصلحة الطفل', range: '129–162', summary: 'يعرض الفصل خصوصية توثيق إصابات التعذيب لدى الأطفال، والاختلافات النمائية والجسدية، ونتائج دراسة مقابلات مع خبراء وتوصيات تكييف الفحص والتقرير.', points: ['الأطفال ليسوا بالغين صغارًا', 'الأمان والموافقة والوقت عناصر حاسمة', 'التقرير وثيقة تخص الطفل وتحمي كرامته'] },

    function cleanForSearch(value) {
      return value.normalize('NFD').replace(/[\u064B-\u065F\u0670\u0640]/g, '')
        .replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي')
        .toLowerCase().replace(/\s+/g, ' ').trim();
    }

    function classifyHeading(text) {
      const t = text.trim();
      if (!t || t.length > 100 || listBullet.test(t) || numbered.test(t) || sentenceEnd.test(t)) return false;
      if (t.startsWith('«') || t.startsWith('“') || t.startsWith('„')) return false;
      if (/^\(?\d+[.)]/.test(t)) return false;
      return true;
    }

    function parseChapter(raw, index) {
      const lines = raw.replace(/^\uFEFF/, '').replace(/\r/g, '').split('\n');
      const blocks = [];
      let paragraph = [];
      let sourcePage = null;
      const pushParagraph = () => {
        const text = paragraph.join(' ').replace(/\s+/g, ' ').trim();
        if (text) blocks.push({ type: 'text', text, page: sourcePage });
        paragraph = [];
      };
      for (const line of lines) {
        const trimmed = line.trim();
        const marker = trimmed.match(pageLabel);
        if (marker) {
          pushParagraph();
          sourcePage = Number(marker[1]);
          blocks.push({ type: 'page', page: sourcePage, text: `الصفحة الأصلية ${sourcePage}` });
          continue;
        }
        if (!trimmed) { pushParagraph(); continue; }
        if (listBullet.test(trimmed) || numbered.test(trimmed)) {
          pushParagraph();
          blocks.push({ type: 'listItem', text: trimmed.replace(listBullet, '').trim(), ordered: numbered.test(trimmed), page: sourcePage });
        } else {
          paragraph.push(trimmed);
        }
      }
      pushParagraph();

      const structured = [];
      let currentList = null;
      for (let i = 0; i < blocks.length; i++) {
        const block = blocks[i];
        if (block.type === 'listItem') {
          const kind = block.ordered ? 'ol' : 'ul';
          if (!currentList || currentList.kind !== kind) {
            currentList = { type: 'list', kind, items: [], page: block.page };
            structured.push(currentList);
          }
          currentList.items.push(block.text);
          continue;
        }
        currentList = null;
        if (block.type === 'text' && classifyHeading(block.text)) {
          block.type = /^الفصل|^الجزء/.test(block.text) ? 'chapterHeading' : 'heading';
          block.level = block.type === 'chapterHeading' ? 2 : 3;
        }
        structured.push(block);
      }
      structured.forEach((b, i) => { b.id = `c${index}-b${i}`; });
      return structured;
    }

    function observeSections(blocks) {
      if (state.sectionObserver) state.sectionObserver.disconnect();
      const location = document.getElementById('locationMeta');
      const sectionLinks = [...document.querySelectorAll('.section-link')];
      state.sectionObserver = new IntersectionObserver(entries => {
        const visible = entries.filter(entry => entry.isIntersecting).sort((a,b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
        if (!visible) return;
        const block = blocks.find(item => item.id === visible.target.id);
        const page = block?.page;
        state.currentBlockId = visible.target.id;
        state.currentPage = page ?? state.currentPage;
        if (location) location.textContent = page ? `موضعك: صفحة المصدر ${toArabicDigits(page)}` : 'موضعك: داخل الفصل';

            const target = document.getElementById(item.blockId);
            target?.scrollIntoView({ behavior: 'smooth', block: 'center' });
            if (target) { target.classList.add('search-hit'); setTimeout(() => target.classList.remove('search-hit'), 1800); }
          }, 50);
        });
        searchResults.append(button);
      });
    }

    function appendHighlightedText(container, text, query) {
      const position = text.toLocaleLowerCase().indexOf(query.toLocaleLowerCase());
      if (!query || position < 0) { container.textContent = text; return; }
      container.append(document.createTextNode(text.slice(0, position)));
      const mark = document.createElement('mark');
      mark.textContent = text.slice(position, position + query.length);
      container.append(mark, document.createTextNode(text.slice(position + query.length)));
    }

    async function start() {
      try {
        const loaded = await Promise.all(chapters.map(async chapter => {
          const response = await fetch(chapter.file);
          if (!response.ok) throw new Error(`تعذر تحميل ${chapter.file}`);
          const text = await response.text();
          return { text, blocks: parseChapter(text, chapters.indexOf(chapter)) };
        }));
        state.raw = loaded.map(item => item.text);
        state.data = loaded.map(item => item.blocks);
        makeSearchIndex();
        document.getElementById('loadingState')?.remove();
        const saved = Number(localStorage.getItem('arabic-book-chapter'));
        renderChapter(Number.isInteger(saved) && saved >= 0 && saved < chapters.length ? saved : 0);
        const savedPosition = localStorage.getItem('arabic-book-position');
        if (savedPosition && Number(localStorage.getItem('arabic-book-position-chapter')) === state.active) {
          setTimeout(() => document.getElementById(savedPosition)?.scrollIntoView({ block: 'start' }), 80);
        }
      } catch (error) {
        main.innerHTML = `<section class="empty-state"><h1>تعذر تحميل النصوص</h1><p>افتح هذه الصفحة عبر الخادم المحلي الموجود مع ملفات الكتاب حتى يتمكن القارئ من تحميل الفصول.</p><p dir="ltr">${String(error.message || error)}</p></section>`;
      }
    }

    searchInput.addEventListener('input', () => renderSearchResults(searchInput.value));
    searchInput.addEventListener('focus', () => renderSearchResults(searchInput.value));
    document.addEventListener('click', event => {
      if (!event.target.closest('.search-wrap')) {
        searchResults.classList.remove('open');
        searchInput.setAttribute('aria-expanded', 'false');
        searchInput.removeAttribute('aria-activedescendant');
      }
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') { searchResults.classList.remove('open'); searchInput.setAttribute('aria-expanded', 'false'); searchInput.removeAttribute('aria-activedescendant'); }
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') { event.preventDefault(); searchInput.focus(); }
      if (searchResults.classList.contains('open') && ['ArrowDown', 'ArrowUp'].includes(event.key)) {
        const options = [...searchResults.querySelectorAll('[role="option"]')];
        if (!options.length) return;
        event.preventDefault();
        state.focusedResult = state.focusedResult < 0
          ? (event.key === 'ArrowDown' ? 0 : options.length - 1)
          : (state.focusedResult + (event.key === 'ArrowDown' ? 1 : -1) + options.length) % options.length;
        options.forEach((option, index) => {
          option.setAttribute('aria-selected', String(index === state.focusedResult));
          if (index === state.focusedResult) {
            searchInput.setAttribute('aria-activedescendant', option.id);
            option.scrollIntoView({ block: 'nearest' });
          }
        });
      }
      if (searchResults.classList.contains('open') && event.key === 'Enter' && state.focusedResult >= 0) {
        event.preventDefault();
        searchResults.querySelectorAll('[role="option"]')[state.focusedResult]?.click();
      }
    });
    start();
  </script>
</body>
</html>
